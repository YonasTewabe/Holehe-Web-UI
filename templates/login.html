<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - OSINT Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e2330;
      border: 1px solid #2d3348;
      border-radius: 10px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
    }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      background: #0f1117;
      border: 1px solid #2d3348;
      border-radius: 6px;
      color: #e2e8f0;
      outline: none;
    }
    input:focus { border-color: #4f80ff; }
    .btn {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary { background: #4f80ff; color: #fff; }
    .btn-primary:hover { background: #3b6ef0; }
    .btn-outline { background: transparent; border: 1px solid #2d3348; color: #94a3b8; margin-top: 12px; }
    .btn-outline:hover { border-color: #4f80ff; color: #4f80ff; }
    .flash {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    .flash.error { background: #2d1515; border: 1px solid #7f1d1d; color: #fca5a5; }
    .flash.success { background: #152d1a; border: 1px solid #166534; color: #86efac; }
    .links { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #94a3b8; }
    .links a { color: #4f80ff; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    <p>Sign in to your account</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <div class="links">
      Don't have an account? <a href="{{ url_for('register') }}">Register</a>
    </div>
  </div>
</body>
</html>
